# Options par defaut de Zadig pour la cle RTL-SDR (SDRStudio)
[general]
  advanced_mode = true
  exit_on_success = false
  log_level = 1

[device]
  # N'affiche que les peripheriques sans pilote : la cle RTL-SDR apparait seule
  list_all = false
  include_hubs = false
  trim_whitespaces = true

[driver]
  # 0 = WinUSB (requis par librtlsdr)
  default_driver = 0
  extract_only = false
