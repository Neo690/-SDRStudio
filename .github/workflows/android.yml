name: Builds

# Deux cibles : APK Android (Kotlin + JNI) et coeur DSP Windows + auto-test via
# build.bat. Le coeur C++ etant partage, core/ declenche les deux jobs.

on:
  # Listes identiques sous push et pull_request : gardees explicites plutot
  # qu'avec une ancre YAML, pour ne pas dependre du parseur de GitHub sur "on".
  push:
    paths:
      - "android/**"
      - "core/**"
      - "win/**"
      - "tools/**"
      - "build.bat"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - "core/**"
      - "win/**"
      - "tools/**"
      - "build.bat"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: builds-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      # JAVA_HOME pour le wrapper, ANDROID_HOME / ANDROID_SDK_ROOT pour l'AGP :
      # local.properties (sdk.dir) est ignore par git, il n'arrive donc jamais ici.
      - name: JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: SDK Android (cmdline-tools + licences)
        uses: android-actions/setup-android@v4

      # Versions imposees par android/app/build.gradle.kts.
      - name: Installer le NDK, CMake et platform 34
        run: |
          sdkmanager --install \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;26.1.10909125" \
            "cmake;3.22.1"

      # Remplace le cache de l'action setup-gradle supprimee : dependances dans
      # ~/.gradle/caches, distribution Gradle 8.7 dans ~/.gradle/wrapper.
      - name: Cache Gradle (dependances + wrapper)
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle.kts', 'android/gradle.properties', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Compiler l'APK debug (Kotlin + JNI arm64/armv7)
        run: ./gradlew --console=plain assembleDebug

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: sdrstudio-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

  build-windows-selftest:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: cmd

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      # build.bat exige g++ (MinGW-w64 + UCRT), absent du runner : path-type
      # inherit met UCRT64 sur le PATH des etapes suivantes.
      - name: MinGW-w64 (MSYS2 UCRT64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: mingw-w64-ucrt-x86_64-gcc
          path-type: inherit

      # Construit SDRStudio.exe et sdr_selftest.exe ; librtlsdr.dll est chargee
      # a l'execution, donc rien d'autre a installer.
      - name: Compiler le coeur DSP et l'auto-test (build.bat)
        run: build.bat

      # Sort en erreur si un controle DSP echoue (modes, stereo, debit).
      - name: Lancer l'auto-test du coeur DSP
        run: build\sdr_selftest.exe
