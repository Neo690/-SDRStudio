name: Android

# APK debug : Kotlin + JNI (arm64/armv7). Le coeur C++ est partage (le
# CMakeLists Android compile ../core), donc un changement de core/ declenche
# aussi le workflow Windows. Windows, lui, est couvert par windows.yml.

on:
  # Chemins propres a Android : un changement de win/, tools/ ou build.bat ne
  # lance pas ce workflow.
  push:
    paths:
      - "android/**"
      - "core/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - "core/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

# Groupe distinct de celui de windows.yml : deux workflows qui partagent un
# groupe s'annuleraient mutuellement.
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      # JAVA_HOME pour le wrapper, ANDROID_HOME / ANDROID_SDK_ROOT pour l'AGP :
      # local.properties (sdk.dir) est ignore par git, il n'arrive donc jamais ici.
      - name: JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: SDK Android (cmdline-tools + licences)
        uses: android-actions/setup-android@v4

      # Versions imposees par android/app/build.gradle.kts.
      - name: Installer le NDK, CMake et platform 34
        run: |
          sdkmanager --install \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;26.1.10909125" \
            "cmake;3.22.1"

      # Remplace le cache de l'action setup-gradle supprimee : dependances dans
      # ~/.gradle/caches, distribution Gradle 8.7 dans ~/.gradle/wrapper.
      - name: Cache Gradle (dependances + wrapper)
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle.kts', 'android/gradle.properties', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Compiler l'APK debug (Kotlin + JNI arm64/armv7)
        run: ./gradlew --console=plain assembleDebug

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: sdrstudio-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
