name: Builds

# Compile les deux cibles du projet sur les runners GitHub :
#  - Android : APK debug (Kotlin + JNI arm64/armv7) ;
#  - Windows : coeur DSP + banc d'essai, via build.bat (MinGW-w64/UCRT).
# Le coeur C++ etant partage (android/app/src/main/cpp/CMakeLists.txt compile
# ../core, build.bat compile core/), les changements dans core/ declenchent
# les deux jobs.

on:
  push:
    paths:
      - "android/**"
      - "core/**"
      - "win/**"
      - "tools/**"
      - "build.bat"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - "core/**"
      - "win/**"
      - "tools/**"
      - "build.bat"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: builds-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Installe les command-line tools, accepte les licences du SDK et met
      # sdkmanager sur le PATH.
      - name: SDK Android (cmdline-tools + licences)
        uses: android-actions/setup-android@v4

      # Versions imposees par android/app/build.gradle.kts (compileSdk 34,
      # build-tools 34.0.0, ndkVersion 26.1.10909125, CMake 3.22.1).
      - name: Installer le NDK, CMake et platform 34
        run: |
          sdkmanager --install \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;26.1.10909125" \
            "cmake;3.22.1"

      - name: Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      # local.properties contient le chemin du SDK d'une machine de developpement
      # (C:/Users/...). Le runner fournit ANDROID_HOME : ce fichier le masquerait.
      - name: Retirer local.properties
        run: rm -f local.properties

      - name: Compiler l'APK debug (Kotlin + JNI arm64/armv7)
        run: gradle --console=plain assembleDebug

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: sdrstudio-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

  build-windows-selftest:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: cmd

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      # build.bat demande g++ (MinGW-w64 + UCRT, voir README). Le runner Windows
      # n'en fournit pas : on installe la chaine UCRT64 de MSYS2. path-type
      # inherit la rend visible aux etapes suivantes, donc "where g++" dans
      # build.bat la trouve.
      - name: MinGW-w64 (MSYS2 UCRT64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: mingw-w64-ucrt-x86_64-gcc
          path-type: inherit

      - name: Verifier la chaine de compilation
        run: |
          where g++
          g++ --version

      # Construit build\SDRStudio.exe et build\sdr_selftest.exe.
      # librtlsdr.dll est chargee dynamiquement a l'execution : aucune
      # dependance a installer pour compiler.
      - name: Compiler le coeur DSP et l'auto-test (build.bat)
        run: build.bat

      # Modes, FM stereo, invariance de phase et debit : le programme sort en
      # erreur si un controle echoue.
      - name: Lancer l'auto-test du coeur DSP
        run: build\sdr_selftest.exe
